[UI]
Theme=Dark
Language=eng
AllowIniOverrides=1

[Backup]
CloseDBBeforeBackup=1

[Restore]
DefaultPageSize=8192
DefaultNumBuffers=2048
RegisterDBAfterRestore=1
DefaultSegmentSize=64
DefaultSegmentUnit=MB

[Scripter]
EchoInput=1
StopOnFirstError=0
AutoDDL=1
IgnoreCreateDatabase=0
IgnoreGrants=0
ShowAffectedRows=1
ShowPerformanceStats=1

[ClipboardExport]
MaxExportRows=200

[MetaData]
AlwaysQuoteIdentifiers=1
CaseSensitiveObjectNames=1
ShowSystem=0

[IntelliSense]
ReloadCacheOnNodeExpand=0

[MetaDataTableExtract]
ExtractDomains=1
ExtractIndex=1
ExtractForeign=1
ExtractCheck=1
ExtractTrigger=1
ExtractGrant=1
ExtractData=0

[MainTreeView]
AlwaysRefresh=0
FontName=Arial
FontStyle=
FontSize=14
FontColor=clRed
AutoFilter=0

[QueryWindow]
AutoCommit=1
ExecMultiStatementsAsScript=1
ShowNavigator=1
BackgroundColor=clSilver
FontName=Courier New
FontSize=10
FontColor=clBlack
FontStyle=

[TransactionDefaults]
TxFileName=read_committed.txt

[CSVExport]
DefaultBatchSize=500000

[CSVEditor]
CSVDefaultFieldLength=50
CSVDelimiter=,
CSVQuoteChar="
CSVLineEnding=LF
CSVFirstLineAsFieldNames=1
CSVIgnoreOuterWhitespace=1
CSVQuoteOuterWhitespace=0
AutoDetectLineEnding=1
AutoDetectDelimiter=1
AutoDetectQuoteChar=1
=#Read
CSVBlockSizeBytes=1048576
CSVBufferSizeBytes=2097152
CSVInitialCellCapacity=512
CSVRowWidthScanMB=100
CSVMinRowsForRowWidthScan=100
CSVProgressUpdatePercent=5
CSVBlockSize=33554432
CSVBufferSize=67108864
CSVAutoTuneCSVBuffer=1
=#Write
CSVSaveBufferSizeBytes=8192
CSVSaveProgressUpdatePercent=5;
CSVSaveWriteBOM=1
CSVSaveUseRange=1
CSVSaveStopAfterRow=1000;
AutoDetectDecimalSeparator=1

[UpdateChecker]
AutoSearchOnProgramStart=1
UnzipAfterDownload=1
RunNewVersionAfterUnzip=0
DeleteOldVersions=0

[Database]
NumBuffers=1024

[SQLMonitor]
TraceEnabled=0
TraceFlags=tfConnect,tfTransact,tfQPrepare,tfQExecute,tfQFetch,tfService,tfBlob,tfStmt,tfError,tfMisc
SlowQueryThreshold=5000

[FireBird]
InitialFBClientLib=/opt/firebird6/lib/libfbclient.so.6.0.0

[CSV]
RowWidthScanRows=0
