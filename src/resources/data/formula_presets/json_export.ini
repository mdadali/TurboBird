[Preset]
Name=JSON Export
Description=JSON-oriented values, strings/dates wrapped in double quotes
Separator=,
DecimalPoint=.
QuoteChar="
LineEnding=LF
IncludeHeader=1
HeaderQuoted=1
DataQuoted=1
SkipTypes=ARRAY,BLOB_BINARY,BLOB_TEXT
BooleanTrue=TRUE
BooleanFalse=FALSE

[Formulas]
STRING=$1
INTEGER=$1
FLOAT=$1
DATE=$1
TIMESTAMP=$1
BOOLEAN=$1
