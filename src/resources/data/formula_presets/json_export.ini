[Preset]
Name=JSON Export
Description=Export all fields as JSON values
Separator=,
QuoteChar=
IncludeHeader=false

[Formulas]
STRING='"' || $1 || '"'
INTEGER=$1
FLOAT=$1
BOOLEAN=CASE WHEN $1 THEN 'true' ELSE 'false' END
DATE='"' || CAST($1 AS VARCHAR(10)) || '"'
TIMESTAMP='"' || CAST($1 AS VARCHAR(19)) || '"'
