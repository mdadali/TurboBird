[Preset]
Name=Fixed Format
Description=Export all fields as fixed-width columns
Separator=
QuoteChar=
IncludeHeader=false

[Formulas]
STRING=CAST($1 AS CHAR(50))
INTEGER=CAST($1 AS CHAR(10))
FLOAT=CAST($1 AS CHAR(20))
DATE=CAST($1 AS CHAR(10))
TIMESTAMP=CAST($1 AS CHAR(19))
BOOLEAN=CAST($1 AS CHAR(5))
