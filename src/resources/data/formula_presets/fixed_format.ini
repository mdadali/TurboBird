[Preset]
Name=Fixed Format
Description=Fixed-width format, no separator, no header
Separator=
DecimalPoint=.
QuoteChar=
LineEnding=LF
IncludeHeader=0
HeaderQuoted=0
DataQuoted=0
SkipTypes=ARRAY,BLOB_BINARY,BLOB_TEXT
BooleanTrue=TRUE
BooleanFalse=FALSE

[Formulas]
STRING=CAST($1 AS CHAR(50))
INTEGER=CAST($1 AS CHAR(10))
FLOAT=CAST($1 AS CHAR(20))
DATE=CAST($1 AS CHAR(10))
TIMESTAMP=CAST($1 AS CHAR(19))
BOOLEAN=CAST($1 AS CHAR(5))
