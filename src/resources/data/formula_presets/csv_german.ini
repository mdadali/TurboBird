[Preset]
Name=CSV German
Description=German/European CSV: semicolon separator, comma decimal point
Separator=;
DecimalPoint=,
QuoteChar="
LineEnding=LF
IncludeHeader=1
HeaderQuoted=1
DataQuoted=1
SkipTypes=ARRAY,BLOB_BINARY,BLOB_TEXT
BooleanTrue=TRUE
BooleanFalse=FALSE

[Formulas]
STRING=$1
INTEGER=$1
FLOAT=REPLACE(CAST($1 AS VARCHAR(50)), '.', ',')
DATE=$1
TIMESTAMP=$1
BOOLEAN=$1
BLOB=SUBSTRING($1 FROM 1 FOR 32765)
