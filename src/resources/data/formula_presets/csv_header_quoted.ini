[Preset]
Name=CSV Header Quoted
Description=Header fields quoted, data fields raw
Separator=,
DecimalPoint=.
QuoteChar="
LineEnding=LF
IncludeHeader=1
HeaderQuoted=1
DataQuoted=0
SkipTypes=ARRAY,BLOB_BINARY,BLOB_TEXT
BooleanTrue=TRUE
BooleanFalse=FALSE

[Formulas]
STRING=$1
INTEGER=$1
FLOAT=$1
DATE=$1
TIMESTAMP=$1
BOOLEAN=$1
BLOB=SUBSTRING($1 FROM 1 FOR 32765)
