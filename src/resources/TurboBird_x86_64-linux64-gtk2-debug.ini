[UI]
Language=eng
Theme=Light
AllowIniOverrides=1

[FireBird]
InitialFBClientLib=/opt/FireBird/Firebird-6.0.0.1355-f3c5da8-linux-x64/lib/libfbclient.so.6.0.0

[Scripter]
EchoInput=0
StopOnFirstError=0
AutoDDL=0
IgnoreCreateDatabase=0
IgnoreGrants=0
ShowAffectedRows=0
ShowPerformanceStats=1

[Backup]
CloseDBBeforeBackup=1

[Restore]
DefaultPageSize=16384
DefaultNumBuffers=2048
DefaultSegmentSize=64
DefaultSegmentUnit=MB
RegisterDBAfterRestore=1

[ClipboardExport]
MaxExportRows=0

[MetaData]
AlwaysQuoteIdentifiers=0
CaseSensitiveObjectNames=1
ShowSystem=0

[IntelliSense]
ReloadCacheOnNodeExpand=0

[MetaDataTableExtract]
ExtractDomains=1
ExtractIndex=1
ExtractForeign=1
ExtractCheck=1
ExtractTrigger=1
ExtractGrant=1
ExtractData=0

[MainTreeView]
AlwaysRefresh=0
Color=clRed
FontName=Arial
FontStyle=
FontSize=10
FontColor=clWhite
AutoFilter=1

[QueryWindow]
AutoCommit=1
ExecMultiStatementsAsScript=1
ShowNavigator=1
BackgroundColor=clSilver
FontName=DejaVu Sans Mono
FontSize=10
FontColor=clBlack
FontStyle=

[TransactionDefaults]
TxFileName=read_committed.txt

[BulkExport]
DefaultBatchSize=1000000

[CSVEditor]
CSVDelimiter=,
CSVLineEnding=LF
CSVQuoteChar="
CSVFirstLineAsFieldNames=1
CSVIgnoreOuterWhitespace=1
CSVQuoteOuterWhitespace=0
CSVDefaultFieldLength=70

[UpdateChecker]
AutoSearchOnProgramStart=1
UnzipAfterDownload=1
RunNewVersionAfterUnzip=1
DeleteOldVersions=0

[Database]
NumBuffers=1024

[SQLMonitor]
TraceEnabled=0
TraceFlags=tfConnect,tfTransact,tfQPrepare,tfQExecute,tfQFetch,tfService,tfBlob,tfStmt,tfError,tfMisc
SlowQueryThreshold=5000
