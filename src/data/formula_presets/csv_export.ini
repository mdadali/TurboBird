[Preset]
Name=CSV Export
Description=Export all fields as quoted CSV values (numbers unquoted)
Separator=,
QuoteChar="
IncludeHeader=1

[Formulas]
STRING=''' || $1 || '''
INTEGER=$1
FLOAT=$1
DATE=''' || CAST($1 AS VARCHAR(10)) || '''
TIMESTAMP=''' || CAST($1 AS VARCHAR(19)) || '''
BOOLEAN=$1
BLOB=''' || CAST(SUBSTRING($1 FROM 1 FOR 32765) AS VARCHAR(32765)) || '''
